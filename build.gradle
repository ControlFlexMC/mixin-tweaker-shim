// The tweaker shim: one class the manifest must name, one class that does the work.
//
// It is NOT a Java agent and NOT a mixin provider. It IS a mod, on purpose: other mods write
// `required-after:mixintweakershim`, which FML can only check against the mod list, so this jar
// has to be in that list. It gets there by declaring ForceLoadAsMod -- the same attribute it
// reads when it restores other mods from FML's known-library list.
plugins {
    id 'java-library'
}

group = 'com.ifels.mixinshim'
version = '0.9.0'

repositories {
    // launchwrapper ships with the game, not on Maven Central.
    maven {
        name = 'Mojang'
        url = 'https://libraries.minecraft.net/'
    }
    // Only for the @Mod annotation; nothing from here is packaged or loaded at runtime by us.
    maven {
        name = 'Forge'
        url = 'https://maven.minecraftforge.net/'
    }
    mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
    // The jar runs inside a 1.12.2 JVM, which is Java 8. Nothing newer may reach it.
    options.release = 8
    options.encoding = 'UTF-8'
}

dependencies {
    // ITweaker / LaunchClassLoader only -- never packaged, never loaded by this jar at runtime
    // beyond what the launcher already provides.
    compileOnly 'net.minecraft:launchwrapper:1.12'
    // The tests instantiate the forwarder, so they need ITweaker on the test classpath as well.
    testImplementation 'net.minecraft:launchwrapper:1.12'
    // The container's annotation is the public contract, so the test asserts on it.
    compileOnly('net.minecraftforge:forge:1.12.2-14.23.5.2859:universal') { transitive = false }
    testImplementation('net.minecraftforge:forge:1.12.2-14.23.5.2859:universal') { transitive = false }

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// One source of truth for the version: build.gradle. mcmod.info is a template.
tasks.named('processResources') {
    inputs.property('version', project.version)
    filesMatching('mcmod.info') {
        expand('version': project.version)
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

jar {
    manifest {
        // The one attribute this jar exists for. Mixin's classpath scan matches the value
        // literally, and LaunchWrapper resolves the class before Forge constructs anything.
        attributes('TweakClass': 'org.spongepowered.asm.launch.MixinTweaker')
        // Says "I am a mod, do not skip me as a library". The shim itself reads this attribute when
        // it restores other jars, and provider platform agents read it when they force-load.
        attributes('ForceLoadAsMod': 'true')
    }
}

// ---------------------------------------------------------------------------
// The shape gate: three class files, one manifest attribute, nothing else.
//
// WHY THIS EXISTS. This jar is reviewed as "a library that squats someone else's
// class name". That argument only survives while the squat is exactly one class.
// The moment a fourth class appears -- an accidental dependency, a helper, a
// shaded library -- the jar stops being auditable at a glance and starts looking
// like the thing it is trying not to look like.
// ---------------------------------------------------------------------------
tasks.register('verifyShimJar') {
    group = 'verification'
    description = 'Fails when the shim jar carries anything beyond the three classes it must.'
    dependsOn tasks.named('jar')
    def artifact = tasks.named('jar').flatMap { it.archiveFile }
    inputs.file(artifact).withPropertyName('shimJar')
    doLast {
        def file = artifact.get().asFile
        def tweaker = 'org/spongepowered/asm/launch/MixinTweaker.class'
        new java.util.zip.ZipFile(file).withCloseable { zip ->
            def classes = zip.entries().findAll { it.name.endsWith('.class') }*.name
            if (!classes.contains(tweaker)) {
                throw new GradleException("SHIM GATE FAILED: ${file.name} does not contain ${tweaker}, " +
                        "so its TweakClass attribute names a class the jar cannot supply.")
            }
            def foreign = classes.findAll { it.startsWith('org/') && it != tweaker }
            if (foreign) {
                throw new GradleException("SHIM GATE FAILED: ${file.name} ships classes under org/ " +
                        "that it does not own: ${foreign.take(10)} (${foreign.size()} total).")
            }
            // Named, not counted: the jar's audit story is "exactly these classes", and a bare
            // number would let one be swapped for another without the gate noticing.
            def expected = [
                    'org/spongepowered/asm/launch/MixinTweaker.class',
                    'com/ifels/mixinshim/MixinTweakShim.class',
                    'com/ifels/mixinshim/MixinTweakShim$TweakState.class',
                    'com/ifels/mixinshim/MixinTweakShim$VersionCheck.class',
                    'com/ifels/mixinshim/MixinShimMod.class',
            ]
            def unexpected = classes.findAll { !expected.contains(it) }
            def missing = expected.findAll { !classes.contains(it) }
            if (unexpected || missing) {
                throw new GradleException("SHIM GATE FAILED: ${file.name} class set changed. " +
                        "Unexpected: ${unexpected.sort()}; missing: ${missing.sort()}. " +
                        "Expected exactly: ${expected.sort()}")
            }
            if (zip.getEntry('mcmod.info') == null) {
                throw new GradleException("SHIM GATE FAILED: ${file.name} has no mcmod.info. " +
                        "Other mods depend on this jar by modid, and a jar that is not in the mod " +
                        "list makes their required-after fail at launch.")
            }
            def entry = zip.getEntry('META-INF/MANIFEST.MF')
            if (entry == null) {
                throw new GradleException("SHIM GATE FAILED: ${file.name} has no manifest")
            }
            def attributes = new java.util.jar.Manifest(zip.getInputStream(entry)).getMainAttributes()
            if (attributes.getValue('TweakClass') != 'org.spongepowered.asm.launch.MixinTweaker') {
                throw new GradleException("SHIM GATE FAILED: TweakClass is " +
                        "'${attributes.getValue('TweakClass')}', expected the literal Mixin name.")
            }
            // The two invariants this version added, guarded here because both fail silently in
            // production: without the attribute the jar never reaches the mod list, and a template
            // that failed to expand ships someone else's version number.
            if (attributes.getValue('ForceLoadAsMod') != 'true') {
                throw new GradleException("SHIM GATE FAILED: ${file.name} does not declare " +
                        "ForceLoadAsMod: true. Provider agents read it to force-load this jar, and " +
                        "the shim itself reads it to restore other jars; without it the jar stays a " +
                        "known library and every dependent's required-after fails at launch.")
            }
            def metadata = zip.getEntry('mcmod.info')
            def metadataText = metadata == null ? '' : zip.getInputStream(metadata).getText('UTF-8')
            if (metadata != null) {
                if (!metadataText.contains('"modid": "mixintweakershim"') &&
                        !metadataText.contains('"modid":"mixintweakershim"')) {
                    throw new GradleException("SHIM GATE FAILED: ${file.name} mcmod.info does not " +
                            "declare modid mixintweakershim; dependents cannot resolve it.")
                }
                if (!metadataText.contains("\"version\": \"${project.version}\"")) {
                    throw new GradleException("SHIM GATE FAILED: ${file.name} mcmod.info version is " +
                            "not ${project.version} -- the \${version} template probably did not " +
                            "expand. Contents: ${metadataText.take(200)}")
                }
            }
            // The tweak phase runs before Forge exists. A forge type in either of those classes
            // would compile now that the annotation dependency is on the classpath, then die with
            // NoClassDefFoundError on exactly the instances this jar exists for.
            ['org/spongepowered/asm/launch/MixinTweaker.class',
             'com/ifels/mixinshim/MixinTweakShim.class'].each { tweak ->
                def bytes = zip.getInputStream(zip.getEntry(tweak)).bytes
                if (new String(bytes, 'ISO-8859-1').contains('net/minecraftforge/')) {
                    throw new GradleException("SHIM GATE FAILED: ${tweak} references " +
                            "net/minecraftforge, which does not exist yet when the tweak phase runs.")
                }
            }
            ['MixinConfigs', 'FMLCorePlugin'].each { forbidden ->
                if (attributes.getValue(forbidden) != null) {
                    throw new GradleException("SHIM GATE FAILED: ${file.name} declares ${forbidden}; " +
                            "this jar must only supply the tweaker, never register configs or plug in.")
                }
            }
        }
        logger.lifecycle('verifyShimJar: three classes, one TweakClass, nothing else')
    }
}

tasks.named('check').configure { dependsOn 'verifyShimJar' }
tasks.named('assemble').configure { dependsOn 'verifyShimJar' }
